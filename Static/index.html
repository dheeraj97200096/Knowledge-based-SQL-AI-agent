<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SQL Copilot</title>
  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
     <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
  <!-- Background overlay -->
  <div class="ai-bg d-flex flex-column vh-100">
    <!-- Header -->
    <header class="py-4 text-center">
      <h1 class="fw-bold text-dark"><i class="fa-solid fa-robot me-2"></i> SQL Copilot</h1>
      <p class="lead text-muted">Your AI assistant for databases</p>
    </header>

    <!-- Chat Area -->
    <main class="flex-grow-1 d-flex justify-content-center align-items-center">
      <div class="card shadow-lg chat-card">
        <div class="card-body chat-box" id="chat-box">
          <p class="text-muted">👋 Start by typing a question below...</p>
        </div>
        <div class="card-footer bg-light">
          <div class="input-group">
            <input type="text" id="question" class="form-control" placeholder="e.g. Show top 5 customers by revenue">
            <button class="btn btn-primary" onclick="sendQuery()"><i class="fa-solid fa-paper-plane"></i> Ask</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    async function sendQuery() {
      const question = document.getElementById("question").value;
      if (!question) return;

      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML += `<div class="user-msg"><span class="badge bg-secondary">You</span> ${question}</div>`;

      const response = await fetch("/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });
      const data = await response.json();

      chatBox.innerHTML += `<div class="copilot-msg"><span class="badge bg-primary">Copilot</span> ${data.sql}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
      document.getElementById("question").value = "";
    }
  </script>
</body>
</html>
